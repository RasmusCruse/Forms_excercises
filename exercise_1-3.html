<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercises</title>
  </head>
  <body>
    <h1>The best search engine!</h1>
    <h2>Google..</h2>
    <form action="http://www.google.com/search">
      <input placeholder="Search anything!" name="q" required autofocus/>
      <button>Lets go!</button>
    </form>

    <h1>Login Screen:</h1>
    <form>
      <fieldset>
        <legend>Account information</legend>
        <label for="first_name">First name:</label>
        <input type="text" id="first_name" name="first_name" required />
        <br />
        <br />
        <label for="last_name">Last name:</label>
        <input type="text" id="last_name" name="last_name" required />
        <br /><br />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" min="6" required>
        <br><br>
        <input type="checkbox" id="yes" name="remember_me" value="yes">
        <label for="remember_me">Remember me?</label>

        <input type="checkbox" id="no" name="remember_me" value="no">
        <label for="remember_me">Do not remember me.</label>
        <br><br>
        <button>Login</button>
      </fieldset>
    </form>
    <h1>Call Back:</h1>
    <form>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+45 Only" maxlength="8" required >
            <br><br>
            <label for="date">Prefered date:</label>
            <input type="date" id="date" name="date" required>
            <br><br>
            <label for="time">Prefered Time Window:</label>
            <select id="time" name="time">
                <option value="morning">Morning</option>
                <option value="midday">Midday</option>
                <option value="noon">Noon</option>
                <option value="evening">Evening</option>
                <option value=" ">No Preference</option>
            </select>
            <br><br>
            <button>Request a Call</button>
        </fieldset>
    </form>
  </body>
</html>
